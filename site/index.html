<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sideral • ECMWF South America</title>
<style>
:root{--bg:#070707;--panel:#111;--line:#2b2b2b;--text:#f2f2f2;--muted:#999;--accent:#0b86bd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,Helvetica,sans-serif;overflow-x:hidden}
header{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:18px;background:#0a0a0a;position:sticky;top:0;z-index:10}
.logo{font-weight:800;letter-spacing:.08em}.status{margin-left:auto;color:#72d38b;font-size:12px}.run{color:#bbb;font-size:12px}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 54px)}
.sidebar{border-right:1px solid var(--line);background:#0b0b0b;padding:14px}.title{font-weight:800;margin-bottom:10px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.steps button{border:1px solid #303030;background:#151515;color:#ddd;padding:8px 3px;cursor:pointer;font-weight:700;font-size:12px}.steps button:hover,.steps button.active{background:#0b86bd;border-color:#0b86bd;color:#fff}.meta{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.6}.controls{margin-top:18px;display:flex;gap:6px}.controls button{flex:1;background:#151515;border:1px solid #333;color:#ddd;padding:8px;cursor:pointer}.main{padding:14px;display:flex;justify-content:center;align-items:flex-start}.frame{width:min(1250px,100%);background:#fff;border:1px solid #333;box-shadow:0 10px 35px #000}.frame img{display:block;width:100%;height:auto}.caption{padding:9px 12px;background:#0d0d0d;color:#aaa;font-size:11px;display:flex;justify-content:space-between}
@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.steps{grid-template-columns:repeat(6,1fr)}.main{padding:6px}}
</style>
</head>
<body>
<header><div class="logo">Sideral • ECMWF</div><div class="run" id="run">carregando...</div><div class="status" id="status">● atualizando</div></header>
<div class="layout">
<aside class="sidebar">
<div class="title">Forecast Hour</div><div class="steps" id="steps"></div>
<div class="controls"><button id="prev">‹</button><button id="play">▶</button><button id="next">›</button></div>
<div class="meta"><b>Modelo</b><br>ECMWF IFS HRES<br><br><b>Domínio</b><br>América do Sul<br><br><b>Resolução</b><br>0.25° (~25 km)<br><br><b>Produtos</b><br>Precipitação acumulada → taxa<br>MSLP<br>Espessura 1000–500 hPa</div>
</aside>
<main class="main"><div class="frame"><img id="map" alt="Mapa ECMWF América do Sul"><div class="caption"><span id="valid">—</span><span>ECMWF open data • Sideral Meteorologia</span></div></div></main>
</div>
<script>
const state={manifest:null,step:0,timer:null};
const $=id=>document.getElementById(id);
function render(){const m=state.manifest;if(!m)return;const run=new Date(m.run);$('run').textContent=`Init: ${run.toISOString().replace('T',' ').slice(0,13)}Z • ${m.resolution}`;const d=m.steps.map(Number);$('steps').innerHTML='';for(const s of d){const b=document.createElement('button');b.textContent=String(s).padStart(3,'0');b.className=s===state.step?'active':'';b.onclick=()=>{state.step=s;render()};$('steps').appendChild(b)}const base=`maps/${m.run_id}/f${String(state.step).padStart(3,'0')}.png`;$('map').src=base+'?v='+m.updated;$('valid').textContent=`F${String(state.step).padStart(3,'0')} • válido ${new Date(run.getTime()+state.step*3600000).toISOString().replace('T',' ').slice(0,13)}Z`;}
async function load(){try{const r=await fetch('maps/index.json?x='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();state.manifest=await r.json();state.step=state.manifest.steps.includes(state.step)?state.step:state.manifest.steps[0];render();$('status').textContent='● dados disponíveis'}catch(e){$('status').textContent='● falha ao carregar'}}
function move(dir){const a=state.manifest.steps,i=a.indexOf(state.step);state.step=a[(i+dir+a.length)%a.length];render()}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('play').onclick=()=>{if(state.timer){clearInterval(state.timer);state.timer=null;$('play').textContent='▶'}else{state.timer=setInterval(()=>move(1),900);$('play').textContent='Ⅱ'}};load();
</script>
</body></html>
