name: GEFS ensemble maps

on:
  workflow_dispatch:
  push:
    branches: [model-gefs]
    paths:
      - 'scripts/generate_gefs_maps.py'
      - 'scripts/sideral_map_style.py'
      - 'requirements-model-maps.txt'
      - '.github/workflows/gefs-maps.yml'
  schedule:
    - cron: '10 9,21 * * *'

permissions:
  contents: write

concurrency:
  group: gefs-ensemble-maps
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout model branch
        uses: actions/checkout@v4
        with:
          ref: model-gefs
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Cache Sideral map assets
        uses: actions/cache@v4
        with:
          path: work/shared-map-assets
          key: sideral-map-assets-v1-${{ runner.os }}
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
      - name: Install dependencies
        run: pip install -r requirements-model-maps.txt
      - name: Generate GEFS ensemble maps
        run: python scripts/generate_gefs_maps.py
      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("site/maps/gefs/generation-report.json")
          if not p.exists(): raise SystemExit("ERRO: relatório GEFS ausente")
          r=json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({"run":r.get("run"),"generatedCount":r.get("generatedCount"),
                            "failureCount":r.get("failureCount"),"members":r.get("members")},indent=2))
          expected_hours = len(r.get("forecastHours", []))
          field_count = int(r.get("fieldCount", 22))
          expected_source_maps = expected_hours * 3 * field_count - len(r.get("skipped", []))
          expected_maps = expected_source_maps * 6  # continente + cinco recortes; ignora apenas campos explicitamente ausentes
          print(f"Mapas esperados após ausências declaradas do GRIB: {expected_maps}")
          if r.get("generatedCount",0) != expected_maps:
              raise SystemExit(f"ERRO: GEFS publicou {r.get('generatedCount')} PNG; esperado {expected_maps}")
          if expected_source_maps < expected_hours * 3 * field_count * 0.90:
              raise SystemExit("ERRO: mais de 10% dos campos/validades GEFS estão ausentes; recuso publicar inventário incompleto")
          if r.get("failureCount",0) != 0:
              raise SystemExit(f"ERRO: GEFS tem {r.get('failureCount')} campos/validades com falha")
          from pathlib import Path
          generated = r.get("generated", [])
          if not generated or not Path(generated[0]).with_suffix(".json.gz").is_file():
              raise SystemExit("ERRO: GEFS não publicou JSON georreferenciado ao lado do PNG")
      - name: Publish maps to model-gefs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/maps/gefs
          if git diff --cached --quiet; then echo "Nenhuma alteração nos mapas GEFS."; exit 0; fi
          git commit -m "chore: atualizar mapas GEFS"
          for attempt in 1 2 3 4 5; do
            git fetch origin model-gefs
            git rebase origin/model-gefs
            if git push origin HEAD:model-gefs; then
              echo "Mapas GEFS publicados na branch model-gefs."
              exit 0
            fi
            sleep 2
          done
          echo "ERRO: publicação GEFS falhou após 5 tentativas."
          exit 1
