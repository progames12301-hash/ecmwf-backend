name: UKMO Global 10 km maps

on:
  workflow_dispatch:
  push:
    branches: [model-ukmet]
    paths:
      - 'scripts/generate_ukmet_maps.py'
      - 'requirements-model-maps.txt'
      - '.github/workflows/ukmet-maps.yml'
  schedule:
    - cron: '55 10,22 * * *'

permissions:
  contents: write

concurrency:
  group: ukmo-global-maps
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout UKMO branch
        uses: actions/checkout@v4
        with:
          ref: model-ukmet
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
      - name: Install dependencies
        run: pip install -r requirements-model-maps.txt
      - name: Generate UKMO maps using Open-Meteo Single Runs
        env:
          UKMET_BATCH_SIZE: "50"
          UKMET_API_WORKERS: "3"
        run: python scripts/generate_ukmet_maps.py
      - name: Validate UKMO native output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("site/maps/ukmet/generation-report.json")
          if not p.exists(): raise SystemExit("ERRO: relatório UKMO ausente")
          r=json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({
            "run":r.get("run"),
            "nativeResolution":r.get("nativeResolution"),
            "generatedCount":r.get("generatedCount"),
            "failureCount":r.get("failureCount"),
            "fieldMapCounts":r.get("fieldMapCounts"),
            "skippedCount":len(r.get("skipped",[]))
          },indent=2,ensure_ascii=False))
          if not r.get("gridResolutionPreserved"):
            raise SystemExit("ERRO: UKMO não confirmou grade nativa")
          if r.get("failureCount",0) != 0:
            raise SystemExit(f"ERRO: UKMO tem {r.get('failureCount')} falhas de geração")
          counts=r.get("fieldMapCounts") or {}
          required=("temperature_2m","dew_point_2m","wind_speed_10m","pressure_msl","precipitation","cape_surface")
          missing=[field for field in required if counts.get(field,0)==0]
          if missing:
            raise SystemExit(f"ERRO: faltam produtos UKMO obrigatórios: {missing}")
          if r.get("generatedCount",0) != sum(counts.values()):
            raise SystemExit("ERRO: generatedCount não bate com fieldMapCounts")
          if r.get("generatedCount",0) < 100:
            raise SystemExit("ERRO: cobertura UKMO nativa insuficiente")
          if any(count % 6 for count in counts.values()):
            raise SystemExit("ERRO: cada saída UKMO deve conter a América do Sul e cinco regiões")
          PY
      - name: Publish maps to model-ukmet branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/maps/ukmet
          if git diff --cached --quiet; then echo "Nenhuma alteração nos mapas UKMO."; exit 0; fi
          git commit -m "chore: atualizar mapas UKMO"
          for attempt in 1 2 3 4 5; do
            git fetch origin model-ukmet
            git rebase origin/model-ukmet
            if git push origin HEAD:model-ukmet; then
              echo "Estado/mapas UKMO publicados na branch model-ukmet."
              exit 0
            fi
            sleep 2
          done
          echo "ERRO: publicação UKMO falhou após 5 tentativas."
          exit 1
