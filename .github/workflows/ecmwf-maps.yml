name: ECMWF South America Maps

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9,21 * * *'

permissions:
  contents: write

concurrency:
  group: ecmwf-maps
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin

      - name: Install map dependencies
        run: pip install -r requirements-maps.txt

      - name: Generate ECMWF maps
        run: python scripts/generate_ecmwf_maps.py --output site

      - name: Publish generated maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas imagens/HTML."
            exit 0
          fi
          git commit -m "chore: atualizar mapas ECMWF"
          git push
