name: ECMWF South America Maps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_ecmwf_maps.py'
      - 'scripts/sideral_map_style.py'
      - 'requirements-maps.txt'
      - '.github/workflows/ecmwf-maps.yml'
  schedule:
    - cron: '15 9,21 * * *'

permissions:
  contents: write

concurrency:
  group: ecmwf-maps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache Sideral map assets
        uses: actions/cache@v4
        with:
          path: work/shared-map-assets
          key: sideral-map-assets-v1-${{ runner.os }}
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin

      - name: Install map dependencies
        run: pip install -r requirements-maps.txt

      - name: Generate ECMWF maps
        run: python scripts/generate_ecmwf_maps.py --output site

      - name: Publish generated maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas imagens/HTML."
            exit 0
          fi
          git commit -m "chore: atualizar mapas ECMWF"

          # A rodada pode levar vários minutos/horas; nesse intervalo, commits
          # do código ou outra alteração em main podem tornar o push não-fast-forward.
          # Rebaseia o commit das imagens sobre o main mais recente e tenta enviar
          # novamente, preservando os arquivos gerados neste runner.
          for attempt in 1 2 3 4 5; do
            echo "Publicação ECMWF: tentativa $attempt/5"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "ERRO: conflito ao integrar main durante publicação das imagens."
              echo "Os mapas e os relatórios continuam disponíveis no workspace deste job."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Mapas ECMWF publicados com sucesso."
              exit 0
            fi

            echo "main mudou durante o push; buscando a versão atual e tentando novamente."
            sleep 2
          done

          echo "ERRO: não foi possível publicar os mapas após 5 tentativas."
          exit 1

      - name: Validate ECMWF field and map report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index_path = Path("site/maps/index.json")
          if not index_path.exists():
              raise SystemExit("ERRO: index.json não foi gerado; não há relatório de validação.")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          report_path = Path("site") / index["generationReport"]
          if not report_path.exists():
              raise SystemExit(f"ERRO: relatório não encontrado: {report_path}")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          print(json.dumps({
              "run": report.get("run"),
              "generatedMapsThisRun": report.get("generatedMapsThisRun"),
              "existingMapsReused": report.get("existingMapsReused"),
              "failureCount": report.get("failureCount"),
              "failures": report.get("failures"),
          }, indent=2, ensure_ascii=False))
          if report.get("failureCount", 1) != 0:
              raise SystemExit("ERRO: existem mapas ECMWF ausentes/falhos; veja generation-report.json e field-inventory.json já publicados.")
          print("OK: todos os mapas foram gerados ou reaproveitados, sem falhas reportadas.")
          PY
