name: ECMWF South America Maps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_ecmwf_maps.py'
      - 'requirements-maps.txt'
      - '.github/workflows/ecmwf-maps.yml'
  schedule:
    - cron: '15 9,21 * * *'

permissions:
  contents: write

concurrency:
  group: ecmwf-maps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin

      - name: Install map dependencies
        run: pip install -r requirements-maps.txt

      - name: Generate ECMWF maps
        run: python scripts/generate_ecmwf_maps.py --output site

      - name: Publish generated maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas imagens/HTML."
            exit 0
          fi
          git commit -m "chore: atualizar mapas ECMWF"
          git push

      - name: Validate ECMWF field and map report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index_path = Path("site/maps/index.json")
          if not index_path.exists():
              raise SystemExit("ERRO: index.json não foi gerado; não há relatório de validação.")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          report_path = Path("site") / index["generationReport"]
          if not report_path.exists():
              raise SystemExit(f"ERRO: relatório não encontrado: {report_path}")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          print(json.dumps({
              "run": report.get("run"),
              "generatedMapsThisRun": report.get("generatedMapsThisRun"),
              "existingMapsReused": report.get("existingMapsReused"),
              "failureCount": report.get("failureCount"),
              "failures": report.get("failures"),
          }, indent=2, ensure_ascii=False))
          if report.get("failureCount", 1) != 0:
              raise SystemExit("ERRO: existem mapas ECMWF ausentes/falhos; veja generation-report.json e field-inventory.json já publicados.")
          print("OK: todos os mapas foram gerados ou reaproveitados, sem falhas reportadas.")
          PY
