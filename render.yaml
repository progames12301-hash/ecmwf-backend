services:
  - type: web
    name: sideral-ecmwf
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ECMWF_RESOLUTION
        value: 0p1
      - key: ECMWF_CACHE_DIR
        value: /tmp/ecmwf-cache
